<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060812;
    --panel: rgba(20, 24, 42, 0.65);
    --panel-raised: rgba(32, 38, 62, 0.8);
    --border: rgba(120, 140, 200, 0.18);
    --accent: #5b8cff;
    --accent-2: #8b6bff;
    --text: #e8ebf5;
    --text-muted: #8890a8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
    overflow: hidden;
    position: relative;
  }

  /* Starfield */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 85% 80%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 40% 45%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 30% 65%, rgba(255,255,255,0.5), transparent);
    background-size: 100% 100%;
    animation: twinkle 5s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.5; }
    to { opacity: 1; }
  }

  /* 3D-style corner orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    z-index: 0;
    filter: blur(1px);
  }

  .orb-1 {
    width: 340px;
    height: 340px;
    top: -120px;
    left: -120px;
    background:
      radial-gradient(circle at 35% 30%, rgba(150, 180, 255, 0.9), transparent 45%),
      conic-gradient(from 210deg, #5b8cff, #8b6bff, #2a3a7a, #5b8cff);
    box-shadow: inset -20px -20px 60px rgba(0,0,0,0.5), 0 0 90px rgba(91, 140, 255, 0.25);
    animation: float1 14s ease-in-out infinite, spin 40s linear infinite;
  }

  .orb-2 {
    width: 260px;
    height: 260px;
    bottom: -100px;
    right: -100px;
    background:
      radial-gradient(circle at 40% 35%, rgba(200, 170, 255, 0.85), transparent 45%),
      conic-gradient(from 120deg, #8b6bff, #ff7fb4, #2a2560, #8b6bff);
    box-shadow: inset -18px -18px 50px rgba(0,0,0,0.5), 0 0 80px rgba(139, 107, 255, 0.25);
    animation: float2 17s ease-in-out infinite, spin 55s linear infinite reverse;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20px, 25px); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-18px, -20px); }
  }

  @keyframes spin {
    from { filter: blur(1px) hue-rotate(0deg); }
    to { filter: blur(1px) hue-rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stars, .orb-1, .orb-2 { animation: none; }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .masthead { text-align: center; }

  .masthead h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    background: linear-gradient(90deg, #cdd8ff, #a9b8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .masthead p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 6px 0 0;
  }

  .chat-window {
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    height: 60vh;
    min-height: 420px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .chat-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 6px #4ade80;
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--text); }
  .reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    max-width: 300px;
    line-height: 1.6;
  }

  .empty-state strong {
    display: block;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin-bottom: 6px;
  }

  .message {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 12px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
  }

  .message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .message.assistant.grounded::before {
    content: "from your documents";
    display: block;
    font-size: 11px;
    color: #a9b8ff;
    margin-bottom: 5px;
  }

  .composer {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  .composer input {
    flex: 1;
    background: rgba(6, 8, 18, 0.6);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    font-family: inherit;
  }

  .composer input::placeholder { color: var(--text-muted); }

  .composer input:focus-visible,
  .composer button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .composer button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: no-preference) {
    .message { animation: rise 0.18s ease-out; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="app">
  <div class="masthead">
    <h1>Stacks</h1>
    <p>Ask a question. It answers from your documents.</p>
  </div>

  <div class="chat-window">
    <div class="chat-toolbar">
      <div class="status"><span class="status-dot"></span>Connected</div>
      <button class="reset-btn" onclick="resetChat()">Clear conversation</button>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <strong>Nothing here yet</strong>
        Ask about anything in the connected documents.
      </div>
    </div>
    <div class="composer">
      <input type="text" id="userInput" placeholder="Ask a question…" onkeydown="if(event.key==='Enter') sendMessage()" autofocus>
      <button id="sendBtn" onclick="sendMessage()">Ask</button>
    </div>
  </div>
</div>

<script>
const messagesDiv = document.getElementById("messages");
const emptyState = document.getElementById("emptyState");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender, grounded) {
  if (emptyState) emptyState.remove();
  const div = document.createElement("div");
  div.className = "message " + sender + (grounded ? " grounded" : "");
  div.textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();

    if (data.reply) {
      addMessage(data.reply, "assistant", data.used_document_context);
    } else {
      addMessage("Something went wrong: " + data.error, "assistant");
    }
  } catch (err) {
    addMessage("Couldn't reach the server. Is it still running?", "assistant");
  }

  sendBtn.disabled = false;
  input.focus();
}

async function resetChat() {
  await fetch("/reset", { method: "POST" });
  messagesDiv.innerHTML = "";
  const div = document.createElement("div");
  div.className = "empty-state";
  div.id = "emptyState";
  div.innerHTML = "<strong>Nothing here yet</strong>Ask about anything in the connected documents.";
  messagesDiv.appendChild(div);
}
</script>

</body>
</html>
